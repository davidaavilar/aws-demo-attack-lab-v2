name: Cortex Cloud Image Scan

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

env:
    CORTEX_API_KEY: ${{secrets.CORTEX_API_KEY}}
    CORTEX_API_KEY_ID: ${{secrets.CORTEX_API_KEY_ID}}
    CORTEX_API_URL: ${{ vars.CORTEX_API_URL }}
    detectChanges: false

jobs:
  docker_build:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app-debian
            context: ./app-debian
            dockerfile: ./app-debian/Dockerfile
            image: davidaavilar/debian:13
          - name: app-alpaquita
            context: ./app-alpaquita
            dockerfile: ./app-alpaquita/Dockerfile
            image: davidaavilar/alpaquita
          - name: app-debian17
            context: ./app-debian17
            dockerfile: ./app-debian17/Dockerfile
            image: davidaavilar/openjdk-hardened:17-debian13
          - name: app-alpaquita17
            context: ./app-alpaquita17
            dockerfile: ./app-alpaquita17/Dockerfile
            image: davidaavilar/alpaquita17
          - name: app-debian21
            context: ./app-debian21
            dockerfile: ./app-debian21/Dockerfile
            image: davidaavilar/openjdk-hardened:21-debian13
          - name: app-alpaquita21
            context: ./app-alpaquita21
            dockerfile: ./app-alpaquita21/Dockerfile
            image: davidaavilar/alpaquita21
          - name: app-debian25
            context: ./app-debian25
            dockerfile: ./app-debian25/Dockerfile
            image: davidaavilar/openjdk-hardened:25-debian13
          - name: app-alpaquita25
            context: ./app-alpaquita25
            dockerfile: ./app-alpaquita25/Dockerfile
            image: davidaavilar/alpaquita25
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: ${{ github.sha }}"

          if git diff --quiet "$BASE_SHA" "${{ github.sha }}" -- "${{ matrix.context }}/" "${{ matrix.dockerfile }}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        if: steps.changes.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      
      - name: Build image
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: local/${{ matrix.name }}:scan
          load: true
          push: false
      - name: Save image
        if: steps.changes.outputs.changed == 'true'
        run: docker save local/${{ matrix.name }}:scan -o /tmp/${{ matrix.name }}.tar
      - name: Upload image artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-image
          path: /tmp/${{ matrix.name }}.tar
  
  docker_scan_cortex_cloud:
    needs: docker_build
    if: needs.docker_build.outputs.changed
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app-debian
            context: ./app-debian
            dockerfile: ./app-debian/Dockerfile
            image: davidaavilar/debian:13
          - name: app-alpaquita
            context: ./app-alpaquita
            dockerfile: ./app-alpaquita/Dockerfile
            image: davidaavilar/alpaquita
          - name: app-debian17
            context: ./app-debian17
            dockerfile: ./app-debian17/Dockerfile
            image: davidaavilar/debian:17
          - name: app-alpaquita17
            context: ./app-alpaquita17
            dockerfile: ./app-alpaquita17/Dockerfile
            image: davidaavilar/alpaquita17
          - name: app-debian21
            context: ./app-debian21
            dockerfile: ./app-debian21/Dockerfile
            image: davidaavilar/debian:21
          - name: app-alpaquita21
            context: ./app-alpaquita21
            dockerfile: ./app-alpaquita21/Dockerfile
            image: davidaavilar/alpaquita21
          - name: app-debian25
            context: ./app-debian25
            dockerfile: ./app-debian25/Dockerfile
            image: davidaavilar/debian:25
          - name: app-alpaquita25
            context: ./app-alpaquita25
            dockerfile: ./app-alpaquita25/Dockerfile
            image: davidaavilar/alpaquita25
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.name }}-image
          path: /tmp
        continue-on-error: true
      - name: Check tar
        id: check_tar
        run: |
          if [ -f "/tmp/${{ matrix.name }}.tar" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Hyperscan
        if: steps.check_tar.outputs.exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhyperscan5 jq
      - name: Download cortexcli
        if: steps.check_tar.outputs.exists == 'true'
        run: |
          set -euo pipefail
          crtx_resp=$(curl -fsSL "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}")
          crtx_url=$(echo "$crtx_resp" | jq -r '.signed_url')
          curl -fsSL -o cortexcli "$crtx_url"
          chmod +x cortexcli

      - name: Check Prerequisites
        if: steps.check_tar.outputs.exists == 'true'
        run: |
          set -euo pipefail

          echo "===== Cortex CLI Version ====="
          ./cortexcli --version

          echo "===== Hyperscan Installation ====="
          dpkg-query -W -f='Package: ${Package}\nStatus: ${Status}\nVersion: ${Version}\nArchitecture: ${Architecture}\n' libhyperscan5

          echo "===== Image Linux Distribution ====="
          TAR="/tmp/${{ matrix.name }}.tar"
          IMAGE_ID=$(tar -xOf "$TAR" manifest.json | jq -r '.[0].Config' | sed 's|.*/||;s|\.json$||')
          docker load -i "$TAR"
          CONTAINER_ID=$(docker create "sha256:$IMAGE_ID")
          trap 'docker rm "$CONTAINER_ID" >/dev/null' EXIT
          docker cp -L "$CONTAINER_ID":/etc/os-release /tmp/os-release
          cat /tmp/os-release

      - name: Scan local image with Cortex CLI
        continue-on-error: true
        if: steps.check_tar.outputs.exists == 'true'
        run: |
          set -euo pipefail
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          ./cortexcli --log-level DEBUG \
            --upload-mode no-upload \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            image scan --archive=true /tmp/${{ matrix.name }}.tar
      - name: Skip scan
        if: steps.check_tar.outputs.exists != 'true'
        run: echo "No tar found for ${{ matrix.name }}, skipping."



        
