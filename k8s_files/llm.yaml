---
apiVersion: v1
kind: Namespace
metadata:
  name: app-llm
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: app-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      nodeSelector:
        workload: llm

      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "llm"
          effect: "NoSchedule"

      containers:
        - name: ollama
          image: davidaavilar/gemma4:e2b
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "1"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "16Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: app-llm
  namespace: app-llm
spec:
  type: ClusterIP
  selector:
    app: llm
  ports:
    - port: 11434
      targetPort: 11434